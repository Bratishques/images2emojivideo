# Local PostgreSQL for development. The bot and the worker run on the host with Bun.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: emojis
      POSTGRES_PASSWORD: emojis
      POSTGRES_DB: emojis
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
